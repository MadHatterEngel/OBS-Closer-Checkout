<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: 'Inter', 'Roboto', sans-serif;
        background-color: transparent;
        color: #FDFBF7;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 5px;
      }
      .camera-button {
        background-color: #E41B23;
        color: #FFFFFF;
        border: none;
        padding: 10px 20px;
        text-transform: uppercase;
        font-family: 'Inter', sans-serif;
        font-weight: 800;
        font-size: 1rem;
        border-radius: 6px;
        box-shadow: none;
        cursor: pointer;
        display: inline-block;
        margin-bottom: 5px;
      }
      .camera-button:active {
        background-color: #C0141D;
        box-shadow: none;
      }
      #file-input {
        display: none;
      }
      #preview {
        max-width: 100%;
        max-height: 300px;
        border: 2px solid #8B4513;
        border-radius: 4px;
        display: none;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <label for="file-input" class="camera-button">
      📸 Open Camera
    </label>
    <input type="file" id="file-input" accept="image/*" capture="environment" />
    <img id="preview" />

    <script>
      function sendMessageToStreamlit(type, data) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: type,
          ...data
        }, "*");
      }

      function sendHeight() {
        sendMessageToStreamlit("streamlit:setFrameHeight", { height: document.body.scrollHeight + 20 });
      }

      // Tell Streamlit we are ready to render
      sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });

      const fileInput = document.getElementById('file-input');
      const preview = document.getElementById('preview');

      fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              // Create a canvas to compress and resize the image
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 1080;
              const MAX_HEIGHT = 1080;
              let width = img.width;
              let height = img.height;

              // Calculate aspect ratio
              if (width > height) {
                if (width > MAX_WIDTH) {
                  height *= MAX_WIDTH / width;
                  width = MAX_WIDTH;
                }
              } else {
                if (height > MAX_HEIGHT) {
                  width *= MAX_HEIGHT / height;
                  height = MAX_HEIGHT;
                }
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              // Export as compressed JPEG (80% quality)
              const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);

              // Show preview
              preview.src = compressedDataUrl;
              preview.style.display = 'block';
              sendHeight();

              // Send compressed, small payload to Streamlit
              sendMessageToStreamlit("streamlit:setComponentValue", { value: compressedDataUrl });
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        }
      });

      window.addEventListener("message", function(event) {
        if (event.data.type === "streamlit:render") {
          sendHeight();
        }
      });

      // Ensure height is set initially
      setTimeout(sendHeight, 100);
    </script>
  </body>
</html>
