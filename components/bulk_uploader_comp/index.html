<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-color: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .upload-btn {
      background-color: #E2231A; /* Outback Red */
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0px 2px 4px rgba(0,0,0,0.1);
      transition: background-color 0.2s;
    }
    .upload-btn:hover {
      background-color: #C11B13;
    }
    #file-input {
      display: none;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <label for="file-input" class="upload-btn">
    📁 Select Multiple Photos
  </label>
  <input type="file" id="file-input" multiple accept="image/*" />
  <div id="status"></div>

  <script>
    function sendMessageToStreamlitClient(type, data) {
        const outData = Object.assign({
            isStreamlitMessage: true,
            type: type,
        }, data);
        window.parent.postMessage(outData, "*");
    }

    const fileInput = document.getElementById('file-input');
    const statusDiv = document.getElementById('status');

    fileInput.addEventListener('change', async (event) => {
        const files = event.target.files;
        if (files.length === 0) return;

        statusDiv.innerText = `Processing ${files.length} photos... please wait.`;
        sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: Math.max(document.body.scrollHeight + 50, 100)});

        const compressedImages = [];
        const errors = [];

        // CRITICAL FIX: Create object URLs synchronously right now before any awaits happen.
        // Android Chrome aggressive memory management often garbage collects or loses access to raw File descriptors
        // if they are left lingering in an array while other intensive async tasks (like canvas encoding) run in a loop.
        const fileUrls = [];
        for (let i = 0; i < files.length; i++) {
            fileUrls.push(URL.createObjectURL(files[i]));
        }

        for (let i = 0; i < fileUrls.length; i++) {
            const objectUrl = fileUrls[i];

            // Convert to base64 via canvas compression
            try {
                const base64Data = await compressImage(objectUrl);
                if (base64Data) {
                    compressedImages.push(base64Data);
                }
            } catch (err) {
                console.error("Error compressing image:", err);
                errors.push(err.message || err.toString());
            } finally {
                // Always clean up memory
                URL.revokeObjectURL(objectUrl);
            }
        }

        if (compressedImages.length === 0) {
            let errorMsg = "Failed to process photos. Please try again.";
            if (errors.length > 0) {
                errorMsg += `
Error details: ${errors.join(', ')}`;
            }
            statusDiv.innerText = errorMsg;
            sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: Math.max(document.body.scrollHeight + 50, 100)});
            return;
        }

        statusDiv.innerText = `Successfully processed ${compressedImages.length} photos!`;

        // Send array of base64 strings back to python
        sendMessageToStreamlitClient("streamlit:setComponentValue", {value: compressedImages});
    });

    async function compressImage(objectUrl) {
        // Try createImageBitmap first (more memory efficient)
        if ('createImageBitmap' in window) {
            try {
                // Fetch the blob from the Object URL so createImageBitmap can use it
                const response = await fetch(objectUrl);
                const blob = await response.blob();
                const bitmap = await createImageBitmap(blob);

                const canvas = document.createElement('canvas');
                let width = bitmap.width;
                let height = bitmap.height;

                const MAX_SIZE = 1080;
                if (width > height) {
                    if (width > MAX_SIZE) {
                        height *= MAX_SIZE / width;
                        width = MAX_SIZE;
                    }
                } else {
                    if (height > MAX_SIZE) {
                        width *= MAX_SIZE / height;
                        height = MAX_SIZE;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(bitmap, 0, 0, width, height);

                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                bitmap.close();
                return compressedDataUrl;
            } catch (e) {
                console.warn("createImageBitmap failed, falling back to Image object", e);
                // Fall back to Image object
            }
        }

        // Fallback to Image object
        return new Promise((resolve, reject) => {
            const img = new Image();

            img.onload = () => {
                try {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    const MAX_SIZE = 1080;
                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Output as JPEG with 0.8 quality
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                } catch (e) {
                    reject(e);
                }
            };

            img.onerror = () => {
                reject(new Error("Failed to load image into memory: Image decoding failed"));
            };

            img.src = objectUrl; // objectUrl is passed as a string
        });
    }

    function sendHeight() {
        sendMessageToStreamlitClient("streamlit:setFrameHeight", {height: Math.max(document.body.scrollHeight + 30, 100)});
    }

    // Initialize component
    sendMessageToStreamlitClient("streamlit:componentReady", {apiVersion: 1});

    window.addEventListener("message", function(event) {
        if (event.data && event.data.type === "streamlit:render") {
            sendHeight();
        }
    });

    // Ensure height is set initially
    setTimeout(sendHeight, 100);
  </script>
</body>
</html>
