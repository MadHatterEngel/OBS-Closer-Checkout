<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        background-color: transparent;
        color: #F4E8D1;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        padding: 5px;
      }
      .camera-button {
        background-color: #8B4513;
        color: #F4E8D1;
        border: 2px solid #5C2E16;
        padding: 10px 20px;
        text-transform: uppercase;
        font-family: 'Rye', cursive;
        font-size: 1rem;
        border-radius: 4px;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
        cursor: pointer;
        display: inline-block;
        margin-bottom: 5px;
      }
      .camera-button:active {
        background-color: #C0392B;
        border-color: #8B0000;
        box-shadow: 2px 2px 5px rgba(0,0,0,0.8);
      }
      #file-input {
        display: none;
      }
      #preview {
        max-width: 100%;
        max-height: 300px;
        border: 2px solid #8B4513;
        border-radius: 4px;
        display: none;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <label for="file-input" class="camera-button">
      📸 Open Camera
    </label>
    <input type="file" id="file-input" accept="image/*" capture="environment" />
    <img id="preview" />

    <script>
      function sendMessageToStreamlit(type, data) {
        window.parent.postMessage({
          isStreamlitMessage: true,
          type: type,
          ...data
        }, "*");
      }

      function sendHeight() {
        sendMessageToStreamlit("streamlit:setFrameHeight", { height: document.body.scrollHeight + 20 });
      }

      // Tell Streamlit we are ready to render
      sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });

      const fileInput = document.getElementById('file-input');
      const preview = document.getElementById('preview');

      fileInput.addEventListener('change', (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => {
            preview.src = e.target.result;
            preview.style.display = 'block';
            sendHeight();
            sendMessageToStreamlit("streamlit:setComponentValue", { value: e.target.result });
          };
          reader.readAsDataURL(file);
        }
      });

      window.addEventListener("message", function(event) {
        if (event.data.type === "streamlit:render") {
          sendHeight();
        }
      });

      // Ensure height is set initially
      setTimeout(sendHeight, 100);
    </script>
  </body>
</html>
